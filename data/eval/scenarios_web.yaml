- id: web-atv600-soc
  type: symptom
  query: ATV630 display shows SOC and the motor is not running
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_causes: [Output cut - the output phase loss function sees a motor phase drawing no current]
  expected_sources: [{manual: atv600, pages: [60, 558]}]
  source_url: https://www.se.com/ca/en/faqs/FA360665/
  reference_answer: SOC is the "output cut" state of the output phase loss function - one or more motor phases draw no current, i.e. an open connection to the motor.
  notes: SOC is a status, not a fault code.
  reviewed: false

- id: web-atv600-ocf
  type: fault_code
  query: Pump drive trips on OCF overcurrent
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OCF]
  expected_causes:
  - Parameters in the Motor data menu are not correct
  - Inertia or load too high
  - Mechanical locking
  - Motor autotuned values do not match the motor connected
  expected_sources: [{manual: atv600, pages: [672]}]
  source_url: https://www.se.com/us/en/faqs/FA336832/
  reference_answer: The motor draws more than its nameplate full-load current for too long. Enter the motor nameplate data correctly and adjust the motor control parameters.
