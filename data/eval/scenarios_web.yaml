- id: web-atv600-ethf
  type: fault_code
  query: ATV630 trips on EtHF when the PLC stops talking to it
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [ETHF]
  expected_causes: [Communication interruption on the Modbus TCP/Ethernet IP bus]
  expected_sources: [{manual: atv600, pages: [653]}]
  source_url: https://www.se.com/ca/en/faqs/FA294121/
  reference_answer: A Modbus TCP time-out - communication with the PLC stopped or was interrupted.
  reviewed: false

- id: web-atv600-inf7
  type: fault_code
  query: InF7 internal error on the pump drive
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [INF7]
  expected_causes: [Communication interruption with CPLD component of the control board]
  expected_sources: [{manual: atv600, pages: [660]}]
  source_url: https://www.se.com/au/en/faqs/FA353985/
  reference_answer: Communication with the CPLD on the control board was interrupted; cycling power resets it.
  reviewed: false

- id: web-atv600-cff
  type: fault_code
  query: ATV630 is stuck in CFF after we took out an option module
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [CFF]
  expected_causes: [Option module changed or removed, The configuration check at power-on found an inconsistency]
  expected_sources: [{manual: atv600, pages: [647]}]
  source_url: https://www.se.com/in/en/faqs/FA305355/
  reference_answer: Incorrect configuration - an option module was removed or replaced, so the drive locks in CFF at power-on until the configuration is restored or confirmed.
  reviewed: false

- id: web-atv600-usf
  type: fault_code
  query: Pump drive trips on USF supply mains undervoltage
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [USF]
  expected_causes: [The measured DC bus voltage is lower than the rated voltage of the Supply Mains setting, Supply Mains power too weak]
  expected_sources: [{manual: atv600, pages: [687]}]
  source_url: https://www.se.com/ca/en/faqs/FA316713/
  reference_answer: Measure the real line voltage and compare it with the drive setting; set Mains Voltage (URES) to match the supply, and raise the undervoltage time-out (UST, default 0.2 s) to ride through short sags.
  reviewed: false

- id: web-atv600-ohf
  type: fault_code
  query: ATV630 overheating fault OHF
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OHF]
  expected_causes:
  - Device temperature too high
  - Ambient temperature too high
  - Reduced air flow due to blocked air at the inlet or outlet
  - One of the fans does not work properly
  expected_sources: [{manual: atv600, pages: [672]}]
  source_url: https://www.se.com/us/en/faqs/FA311478/
  reference_answer: OHF trips when the drive thermal state reaches 118 %; the fan starts at 70 % drive or DC-choke thermal state. Check cooling, ambient temperature, air flow and the fans.
  reviewed: false

- id: web-atv600-dryf
  type: fault_code
  query: Dry run fault DRYF on the borewell pump drive
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [DRYF]
  expected_causes: [The dry run monitoring function has detected an error]
  expected_sources: [{manual: atv600, pages: [652]}]
  source_url: https://www.se.com/us/en/faqs/FA318554/
  reference_answer: Dry run is detected from a flow switch or flow sensor, or estimated from power or pressure; with estimation it trips when power falls below DRYX (factory 70 %) times the no-flow curve. Check the water level and the dry-run setup.
  reviewed: false

- id: web-atv600-cli-olf
  type: fault_code
  query: Pump drive shows CLI in the corner and then trips on OLF
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OLF]
  expected_causes: [Excessive motor current has been detected]
  expected_sources: [{manual: atv600, pages: [673]}]
  source_url: https://www.se.com/us/en/faqs/FA308900/
  reference_answer: The motor pulls too much current, so the drive goes into current limitation (CLI); if it lasts, the motor thermal state passes 118 % and it trips on OLF. Check the motor nameplate data, run the motor unloaded, check the wiring and insulation, and check the output voltages are balanced.
  reviewed: false

- id: web-atv600-cnf
  type: fault_code
  query: CNF fieldbus fault on the ATV630
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [CNF]
  expected_causes: [Communication interruption on fieldbus module]
  expected_sources: [{manual: atv600, pages: [649]}]
  source_url: https://www.se.com/us/en/faqs/FA339922/
  reference_answer: Communication between the option card and the master was interrupted. Check EMC, wiring, grounding and cable routing, and that the controller reads or writes within the time-out (tto).
  reviewed: false

# ---------------- ATV900 (DEMO-HOIST-01) ----------------
- id: web-atv900-obf
  type: fault_code
  query: ATV930 trips on OBF while running
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [OBF]
  expected_causes:
  - The DC bus voltage is too high
  - Deceleration time too short or driving load too high
  - Mains voltage too high
  expected_sources: [{manual: atv900, pages: [679]}]
  source_url: https://www.se.com/us/en/faqs/FAQ000272284/
  reference_answer: The drive measures too high a DC-bus voltage while running the motor, above the permitted threshold - typically from regenerated energy.
  reviewed: false

- id: web-atv900-ethernet-eip
  type: symptom
  query: The ATV930 keeps losing its embedded Ethernet connection on our EtherNet/IP network
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_causes: [Communication interruption on the Modbus TCP/Ethernet IP bus]
  expected_sources: [{manual: atv900, pages: [662]}]
  source_url: https://www.se.com/us/en/faqs/FA317296/
  reference_answer: RSTP (rapid spanning tree) is enabled by default on the embedded Ethernet and cannot be changed from the keypad; Schneider gives the fix in an attached document.
  notes: Schneider's answer (RSTP) is not in the manual; FaultSense can only point at the ETHF communication error.
  reviewed: false

- id: web-atv900-mdlf
  type: fault_code
  query: MDLF multidrive link error on the ATV930
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [MDLF]
  expected_causes:
  - The multi-drive link communication has been interrupted while running
  - The function has detected an inconsistency in the system configuration
  expected_sources: [{manual: atv900, pages: [678]}]
  source_url: https://www.se.com/us/en/faqs/FAQ000243511/
  reference_answer: Communication between the server and client drives was interrupted, or the MultiDrive link found an inconsistent system configuration.
  reviewed: false

- id: web-atv900-blf
  type: fault_code
  query: Hoist drive trips on BLF brake control fault
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [BLF]
  expected_causes: [The brake release current is not reached, The torque set point is not reached, The fluxing current is not stable]
  expected_sources: [{manual: atv900, pages: [651]}]
  source_url: https://www.se.com/us/en/faqs/FA359574/
  reference_answer: With brake logic in use the brake-open conditions were not met - the release current (IBR) was not reached in time or the motor could not be fluxed. Check the motor windings, IBR/IRD, the brake engage frequency and the current ramp time.
  reviewed: false

- id: web-atv900-sof
  type: fault_code
  query: Hoist drive trips on SOF overspeed while accelerating
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [SOF]
  expected_causes:
  - Instability or driving load too high
  - A downstream contactor has not closed before the run command
  - The overspeed threshold has been reached
  expected_sources: [{manual: atv900, pages: [688]}]
  source_url: https://www.se.com/sa/en/faqs/FA345468/
  reference_answer: Wrong motor nameplate settings, unsuitable motor control type, or encoder feedback problems. Check the motor data, motor control type, encoder wiring, that any contactor closes before the run command, and the motor/drive/load sizing.
  reviewed: false

- id: web-atv900-brf
  type: fault_code
  query: brF brake feedback fault on the hoist
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [BRF]
  expected_causes: [The status of the brake feedback contact or brake relay feedback does not match the brake logic control]
  expected_sources: [{manual: atv900, pages: [652]}]
  source_url: https://www.se.com/uk/en/faqs/FA359580/
  reference_answer: The brake contact feedback does not match the brake command. Check the brake mechanically, the brake contact input (BCI) and brake assignment (BLC), and the brake release and engage times (BRT, BET).
  reviewed: false

- id: web-atv900-bufo
  type: fault_code
  query: bUFO braking unit open circuit on the ATV930
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [BUFO]
  expected_causes: [Open circuit from braking unit and/or braking resistor, Low current from braking unit and/or braking resistor, Braking unit or braking resistor not connected]
  expected_sources: [{manual: atv900, pages: [653]}]
  source_url: https://www.se.com/us/en/faqs/FA359602/
  reference_answer: Check the braking resistor wiring, whether the resistor has failed, and the BRI1 parameter.
  reviewed: false

- id: web-atv900-buf
  type: fault_code
  query: bUF braking unit short circuit fault on the ATV930
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [BUF]
  expected_causes: [Short circuit inside the braking unit, Braking unit wiring in short circuit, Short circuit to the ground]
  expected_sources: [{manual: atv900, pages: [653]}]
  source_url: https://www.se.com/us/en/faqs/FA359589/
  reference_answer: A short inside the braking module, a failed braking resistor, a ground fault, or BRA set to No with no braking resistor fitted. Inspect the braking unit and resistor wiring and check the settings.
  reviewed: false

- id: web-atv900-anf
  type: fault_code
  query: AnF load slipping error on the hoist drive
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [ANF]
  expected_causes: [The difference between the output frequency and the speed feedback is not correct]
  expected_sources: [{manual: atv900, pages: [651]}]
  source_url: https://www.se.com/us/en/faqs/FA359571/
  reference_answer: Speed feedback does not follow the speed reference (or exceeds 10 % of nominal speed). Check the brake feedback, control wiring and the brake's mechanical condition, and the brake parameters BCI, BLC, BRT and BET.
  reviewed: false

- id: web-atv900-ocf-nomachine
  type: fault_code
  query: What causes an OCF overcurrent fault on an ATV930
  expected_behavior: diagnose
  expected_fault_codes: [OCF]
  expected_causes:
  - Parameters in the Motor data menu are not correct
  - Inertia or load too high
  - Mechanical locking
  expected_sources: [{manual: atv900, pages: [680]}]
  source_url: https://www.se.com/us/en/faqs/FA336832/
  reference_answer: The motor draws more than its nameplate full-load current for too long. Enter the motor nameplate data correctly and adjust the motor control parameters.
  notes: No machine given - the answer must use the ATV900 manual because the operator named an ATV930.
  reviewed: false

