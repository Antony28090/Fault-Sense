  expected_sources: [{manual: atv600, pages: [660]}]
  source_url: https://www.se.com/ca/en/faqs/FA315744/
  reference_answer: The drive does not recognise an installed option card (or the control terminal modules or embedded Ethernet adapter). Check the card is compatible with the drive firmware and properly fitted.
