- id: web-atv600-slf2
  type: fault_code
  query: SLF2 error on the ATV630 while connected to the laptop
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [SLF2]
  expected_causes: [Communication interruption with the commissioning software]
  expected_sources: [{manual: atv600, pages: [680]}]
  source_url: https://www.se.com/us/en/faqs/FAQ000223389/
  reference_answer: Communication with the SoMove commissioning software was lost; check the connection to SoMove.
