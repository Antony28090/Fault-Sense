# Hindi and Tamil eval scenarios, adapted from the real-world set with the same expected pages and
# causes. Written by Claude, not native speakers: every scenario is `reviewed: false` until checked.
# Run: faultsense eval run --scenarios data/eval/scenarios_indic.yaml

- id: indic-hi-atv600-ohf
  type: fault_code
  query: बोरवेल पंप की ड्राइव पर OHF आ रहा है
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OHF]
  expected_causes: [Device temperature too high, Ambient temperature too high, Reduced air flow due to blocked air at the inlet or outlet, One of the fans does not work properly]
  expected_sources: [{manual: atv600, pages: [672]}]
  reviewed: false

