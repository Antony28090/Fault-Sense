# Seeds for data/eval/scenarios.yaml. Regenerate the drafts with `faultsense eval draft`.
# Machines are the placeholders in data/machines.yaml:
#   DEMO-FAN-01 -> atv12, DEMO-CONV-01 -> atv320, DEMO-PUMP-01 -> atv600, DEMO-HOIST-01 -> atv900
# `targets` are the fault codes an answer should rest on; the first target supplies expected_causes.
# A target without `manual` expands to every manual that has the code.

# --- fault-code queries (18) ---
- {id: code-atv12-ohf, type: fault_code, machine_id: DEMO-FAN-01, query: "ATV12 on the exhaust fan shows OHF", targets: [{manual: atv12, code: OHF}]}
