# --- symptom descriptions (18) ---
- {id: sym-atv600-hot-afternoons, type: symptom, machine_id: DEMO-PUMP-01, query: "Pump drive trips after about 10 minutes on hot afternoons, but runs fine in the morning", targets: [{manual: atv600, code: OHF}, {manual: atv600, code: TJF}]}
- {id: sym-atv600-trips-at-start, type: symptom, machine_id: DEMO-PUMP-01, query: "Pump drive trips the moment we press start and the motor just hums", targets: [{manual: atv600, code: OCF}]}
- {id: sym-atv600-low-mains-evening, type: symptom, machine_id: DEMO-PUMP-01, query: "In the evening when the mains voltage drops the pump drive stops with a fault", targets: [{manual: atv600, code: USF}]}
- {id: sym-atv600-dry-well, type: symptom, machine_id: DEMO-PUMP-01, query: "Borewell pump drive stopped, the well had run out of water", targets: [{manual: atv600, code: DRYF}]}
- {id: sym-atv600-blown-fuse, type: symptom, machine_id: DEMO-PUMP-01, query: "One of the incoming fuses in the pump panel blew and the drive tripped", targets: [{manual: atv600, code: PHF}]}
- {id: sym-atv600-plc-comms, type: symptom, machine_id: DEMO-PUMP-01, query: "The PLC keeps losing Modbus communication with the pump drive and the drive stops", targets: [{manual: atv600, code: SLF1}]}
- {id: sym-atv320-heavy-load-hot-motor, type: symptom, machine_id: DEMO-CONV-01, query: "Conveyor motor gets very hot and the drive trips after running fully loaded for an hour", targets: [{manual: atv320, code: OLF}]}
- {id: sym-atv320-new-option-card, type: symptom, machine_id: DEMO-CONV-01, query: "After we swapped the option card the conveyor drive will not run and shows a configuration fault", targets: [{manual: atv320, code: CFF}]}
- {id: sym-atv320-autotune-fails, type: symptom, machine_id: DEMO-CONV-01, query: "Autotune fails when commissioning the new conveyor motor", targets: [{manual: atv320, code: tnf}]}
- {id: sym-atv320-runaway-downhill, type: symptom, machine_id: DEMO-CONV-01, query: "Inclined conveyor runs away when loaded going downhill and the drive trips", targets: [{manual: atv320, code: SOF}, {manual: atv320, code: OBF}]}
- id: sym-atv12-blank-display
  type: symptom
  machine_id: DEMO-FAN-01
  query: "Fan drive display stays blank and the motor does not start"
  expected_causes:
    - "No supply reaching the drive: check the power supply, ground and input phase connections"
    - "Fast stop or freewheel function assigned to a logic input that is not powered (display shows nSt or FSt)"
    - "Run command input not activated for the selected control mode (tCC, tCt)"
    - "Reference or command channel assigned to Modbus and no command received yet"
  expected_sources: [{manual: atv12, pages: [111]}]
  notes: "Hand-written from ATV12 p.111 'Drive does not start, no error code displayed'"
- {id: sym-atv12-high-mains-night, type: symptom, machine_id: DEMO-FAN-01, query: "Fan drive trips at night when the mains voltage goes high", targets: [{manual: atv12, code: OSF}]}
- {id: sym-atv12-damaged-cable, type: symptom, machine_id: DEMO-FAN-01, query: "A forklift damaged the motor cable and now the fan drive trips as soon as it starts", targets: [{manual: atv12, code: SCF1}, {manual: atv12, code: SCF3}]}
- {id: sym-atv12-sensor-wire, type: symptom, machine_id: DEMO-FAN-01, query: "The 4-20 mA sensor wire on the fan drive broke and the drive stopped", targets: [{manual: atv12, code: LFF1}]}
- {id: sym-atv900-fast-lowering, type: symptom, machine_id: DEMO-HOIST-01, query: "Hoist drive trips every time the load is lowered quickly", targets: [{manual: atv900, code: OBF}]}
- {id: sym-atv900-brake-stuck, type: symptom, machine_id: DEMO-HOIST-01, query: "Hoist brake does not release and the drive goes into fault", targets: [{manual: atv900, code: BLF}]}
- {id: sym-atv900-loose-terminal, type: symptom, machine_id: DEMO-HOIST-01, query: "We found a loose motor terminal on the hoist after the drive tripped", targets: [{manual: atv900, code: OPF1}, {manual: atv900, code: OPF2}]}
- {id: sym-atv900-encoder-cable, type: symptom, machine_id: DEMO-HOIST-01, query: "The encoder cable on the hoist motor got damaged and the drive stops with a speed feedback fault", targets: [{manual: atv900, code: SPF}, {manual: atv900, code: ENF}]}

