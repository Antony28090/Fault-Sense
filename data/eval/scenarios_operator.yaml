# OPERATOR-LANGUAGE eval scenarios, 2026-10-04: the way people on a shop floor actually type. Typos and
# shorthand, codes misread off a 7-segment display (0HF), codes with a space (SCF 1), romanised Hindi and
# Tamil (Hinglish/Tanglish, which stay on the English path), symptoms with no code, a drive model named instead
# of a machine, and questions FaultSense should not answer. Expected causes and pages are the manuals' own
# fault entries. Every scenario is `reviewed: false` until a person has checked it.
# Run: faultsense eval run --scenarios data/eval/scenarios_operator.yaml

# ---------------- Typos, shorthand and misread codes ----------------
- id: op-typo-pump-ohf
  type: fault_code
  query: pump drv showing 0HF agn, tripd twice today
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OHF]
  expected_causes: [Device temperature too high, Ambient temperature too high, Reduced air flow due to blocked air at the inlet or outlet, One of the fans does not work properly]
  expected_sources: [{manual: atv600, pages: [672]}]
  notes: Zero for the letter O, as read off the display.
  reviewed: false

- id: op-typo-conv-olf
  type: fault_code
  query: convyr drive trips OLF wen we load hevy boxes
  machine_id: DEMO-CONV-01
  expected_behavior: diagnose
  expected_fault_codes: [OLF]
  expected_causes: [Triggered by excessive motor current]
  expected_sources: [{manual: atv320, pages: [413]}]
  reviewed: false

- id: op-typo-fan-usf
  type: fault_code
  query: fan invrter shows USF evry morning at startup
  machine_id: DEMO-FAN-01
  expected_behavior: diagnose
  expected_fault_codes: [USF]
  expected_causes: [Line supply too low, Transient voltage dip]
  expected_sources: [{manual: atv12, pages: [115]}]
  reviewed: false

- id: op-lower-hoist-brf
  type: fault_code
  query: hoist showing brf what to check
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_fault_codes: [BRF]
  expected_causes: [The status of the brake feedback contact or brake relay feedback does not match the brake logic control]
  expected_sources: [{manual: atv900, pages: [652]}]
  reviewed: false

- id: op-spaced-fan-scf1
  type: fault_code
  query: fan drive SCF 1 trip right after start
  machine_id: DEMO-FAN-01
  expected_behavior: diagnose
  expected_fault_codes: [SCF1]
  expected_causes: [Short-circuit or grounding at the drive output, Ground fault during running status]
  expected_sources: [{manual: atv12, pages: [112]}]
  notes: The code typed with a space, as it looks on some displays.
  reviewed: false

- id: op-sevenseg-pump-ocf
  type: fault_code
  query: pump drive tripped with 0CF when starting
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OCF]
  expected_causes: [Overcurrent limitation is reached, Inertia or load too high, Mechanical locking, Motor autotuned values does not match with the motor connected]
  expected_sources: [{manual: atv600, pages: [672]}]
  reviewed: false

