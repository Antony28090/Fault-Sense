# ---------------- Symptoms with no code ----------------
- id: op-sym-pump-hot-panel
  type: symptom
  query: drive keeps tripping in the afternoon, the panel is very hot to touch
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_causes: [Device temperature too high, Ambient temperature too high, Reduced air flow due to blocked air at the inlet or outlet, One of the fans does not work properly]
  expected_sources: [{manual: atv600, pages: [672]}]
  reviewed: false

- id: op-sym-conv-new-cable
  type: symptom
  query: after the electrician changed the motor cable it trips immediately on start
  machine_id: DEMO-CONV-01
  expected_behavior: diagnose
  expected_causes: [Short-circuit or grounding at the drive output]
  expected_sources: [{manual: atv320, pages: [413, 416]}]
  notes: A short or earth fault in the new cable (SCF1, p.416); overcurrent (OCF, p.413) is also fair.
  reviewed: false

- id: op-sym-hoist-brake
  type: symptom
  query: brake is not opening when we try to lift, motor makes noise
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  expected_causes: [The brake release current is not reached, The torque set point is not reached, The fluxing current is not stable]
  expected_sources: [{manual: atv900, pages: [651]}]
  reviewed: false

- id: op-sym-conv-heavy
  type: symptom
  query: conveyor stops whenever we put heavy boxes on it
  machine_id: DEMO-CONV-01
  expected_behavior: diagnose
  expected_causes: [Triggered by excessive motor current, Inertia or load too high]
  expected_sources: [{manual: atv320, pages: [413]}]
  notes: Motor overload (OLF) or overcurrent (OCF), both on p.413.
  reviewed: false

- id: op-sym-fan-dead
  type: symptom
  query: fan drive dead, no lights on the display
  machine_id: DEMO-FAN-01
  expected_behavior: diagnose
  expected_causes: [Check the power supply to the drive - ground and input phase connections]
  expected_sources: [{manual: atv12, pages: [111]}]
  reviewed: false

- id: op-sym-pump-powercut
  type: fault_code
  query: power cut came and went, now drive shows USF
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [USF]
  expected_causes: [The measured DC bus voltage is lower than the rated voltage of the Supply Mains setting, Supply Mains power too weak]
  expected_sources: [{manual: atv600, pages: [687]}]
  reviewed: false

- id: op-sym-hoist-slip
  type: symptom
  query: load slips down slowly when hoist stops
  machine_id: DEMO-HOIST-01
  expected_behavior: diagnose
  notes: Behaviour only (no expected page or cause yet); the answer belongs in the brake logic settings and needs a person to pick the pages.
  reviewed: false

- id: op-pressure-pump-ohf
  type: fault_code
  query: OHF on the pump, can we just reset and run? production is waiting
  machine_id: DEMO-PUMP-01
  expected_behavior: diagnose
  expected_fault_codes: [OHF]
  expected_causes: [Device temperature too high, Ambient temperature too high, Reduced air flow due to blocked air at the inlet or outlet, One of the fans does not work properly]
  expected_sources: [{manual: atv600, pages: [672]}]
  notes: The answer should say to let the drive cool and remove the cause first, not just reset.
  reviewed: false

