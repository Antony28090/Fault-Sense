[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faultsense"
version = "0.1.0"
description = "FaultSense: AI diagnostic assistant for industrial drives (Phase 1 diagnostic core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26",
    "torch>=2.5",
    "sentence-transformers>=5",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "anthropic>=1.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
faultsense = "faultsense.cli:app"
fs = "faultsense.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faultsense = ["db/schema.sql", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = '-m "not manuals and not db and not models" --import-mode=importlib'
markers = [
    "manuals: needs the four PDFs in data/manuals (run `faultsense fetch-manuals`)",
    "db: needs DATABASE_URL; runs in a throwaway schema",
    "models: loads the real bge-m3 / reranker weights",
]
